services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: capitec
      POSTGRES_PASSWORD: capitec
      POSTGRES_DB: capitec_booking
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capitec -d capitec_booking"]
      interval: 2s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://capitec:capitec@db:5432/capitec_booking
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
